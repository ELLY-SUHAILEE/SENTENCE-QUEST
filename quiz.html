<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prepositions Mission | Sentence Quest</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#e0f2fe,#f8fafc,#fff7ed);
  color:#17324d;
  min-height:100vh;
}

/* HEADER */

header{
  background:linear-gradient(135deg,#075985,#0284c7);
  color:white;
  padding:14px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  font-size:20px;
  font-weight:900;
}

.back-btn{
  border:1px solid rgba(255,255,255,.5);
  background:rgba(255,255,255,.15);
  color:white;
  padding:9px 15px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

/* WRAPPER */

.wrapper{
  max-width:1050px;
  margin:auto;
  padding:24px;
}

/* STUDENT BAR */

.student-bar{
  background:white;
  border-radius:16px;
  padding:13px 18px;
  display:flex;
  justify-content:space-between;
  gap:15px;
  margin-bottom:18px;
  box-shadow:0 6px 18px rgba(15,23,42,.08);
}

.student-item{
  font-size:14px;
  color:#64748b;
}

.student-item strong{
  color:#075985;
  font-size:15px;
}

/* TITLE */

.mission-title{
  text-align:center;
  margin-bottom:18px;
}

.badge{
  display:inline-block;
  background:#dcfce7;
  color:#166534;
  padding:7px 14px;
  border-radius:20px;
  font-size:13px;
  font-weight:900;
  margin-bottom:8px;
}

.mission-title h1{
  color:#075985;
  font-size:34px;
}

.mission-title p{
  color:#64748b;
  margin-top:7px;
}

/* LEVEL MAP */

.level-map{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  margin:18px 0;
}

.level-step{
  background:white;
  color:#94a3b8;
  padding:10px 5px;
  border-radius:10px;
  text-align:center;
  font-size:11px;
  font-weight:900;
}

.level-step.active{
  background:#0284c7;
  color:white;
}

.level-step.done{
  background:#dcfce7;
  color:#166534;
}

/* STATUS */

.status-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  font-weight:bold;
  font-size:14px;
  margin-bottom:7px;
}

.progress{
  width:100%;
  height:13px;
  background:#dbeafe;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:18px;
}

.progress-bar{
  height:100%;
  width:2%;
  background:linear-gradient(90deg,#0ea5e9,#22c55e);
  transition:.35s;
}

/* QUIZ */

.quiz-card{
  background:white;
  border-radius:24px;
  padding:25px;
  box-shadow:0 10px 30px rgba(15,23,42,.12);
}

.level-label{
  text-align:center;
  color:#0284c7;
  font-size:13px;
  font-weight:900;
  letter-spacing:1px;
}

.question{
  text-align:center;
  font-size:25px;
  margin:7px 0 20px;
}

/* PICTURE */

.picture{
  width:100%;
  min-height:350px;
  border-radius:20px;
  background:linear-gradient(#bae6fd 0 68%,#bbf7d0 68%);
  position:relative;
  overflow:hidden;
  margin-bottom:24px;
}

.scene-title{
  position:absolute;
  top:15px;
  left:15px;
  background:rgba(255,255,255,.90);
  padding:8px 12px;
  border-radius:10px;
  font-size:13px;
  font-weight:900;
  z-index:20;
}

.sun{
  position:absolute;
  right:25px;
  top:25px;
  font-size:55px;
}

.cloud{
  position:absolute;
  top:45px;
  left:23%;
  font-size:55px;
}

.object{
  position:absolute;
  font-size:95px;
  z-index:4;
}

.reference{
  position:absolute;
  font-size:125px;
  z-index:3;
}

/* ANSWERS */

.answers{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.answer{
  border:2px solid #dbeafe;
  background:#f8fafc;
  padding:16px;
  border-radius:14px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

.answer:hover{
  border-color:#38bdf8;
  background:#e0f2fe;
}

.answer.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
}

.answer.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#991b1b;
}

/* FEEDBACK */

.feedback{
  display:none;
  text-align:center;
  margin-top:17px;
  padding:14px;
  border-radius:12px;
  font-weight:bold;
  line-height:1.6;
}

.feedback.good{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.feedback.bad{
  display:block;
  background:#fff7ed;
  color:#9a3412;
}

.feedback.learn{
  display:block;
  background:#e0f2fe;
  color:#075985;
}

/* HINT */

.hint{
  display:none;
  text-align:center;
  background:#fffbeb;
  color:#92400e;
  padding:12px;
  margin-top:12px;
  border-radius:10px;
  font-weight:bold;
}

/* CONTROLS */

.controls{
  display:flex;
  gap:10px;
  margin-top:17px;
}

.hint-btn,
.next-btn{
  flex:1;
  padding:14px;
  border:0;
  border-radius:12px;
  font-weight:900;
  cursor:pointer;
  font-size:15px;
}

.hint-btn{
  background:#fef3c7;
  color:#92400e;
}

.next-btn{
  display:none;
  background:#0284c7;
  color:white;
}

/* WRITING */

.write-box{
  grid-column:1/-1;
}

.write-box textarea{
  width:100%;
  min-height:100px;
  resize:none;
  border:2px solid #bae6fd;
  border-radius:14px;
  padding:15px;
  font-size:19px;
  outline:none;
}

.check-btn{
  width:100%;
  margin-top:10px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#22c55e;
  color:white;
  font-weight:900;
  font-size:16px;
  cursor:pointer;
}

.small-note{
  text-align:center;
  color:#64748b;
  margin-top:10px;
  font-size:13px;
}

/* RESULT */

.result{
  text-align:center;
  padding:25px 5px;
}

.trophy{
  font-size:80px;
}

.result h1{
  color:#075985;
  margin-bottom:8px;
}

.student-result{
  max-width:600px;
  margin:20px auto;
  background:#f0f9ff;
  border-radius:15px;
  padding:16px;
}

.student-result-row{
  display:flex;
  justify-content:space-between;
  padding:7px 5px;
  border-bottom:1px dashed #bae6fd;
}

.student-result-row:last-child{
  border-bottom:none;
}

.total-score{
  font-size:42px;
  color:#16a34a;
  font-weight:900;
  margin:20px 0 5px;
}

.percentage{
  color:#64748b;
  margin-bottom:15px;
}

.mastery{
  display:inline-block;
  padding:10px 20px;
  border-radius:30px;
  font-weight:900;
  margin-bottom:20px;
}

.mastered{
  background:#dcfce7;
  color:#166534;
}

.developing{
  background:#fef3c7;
  color:#92400e;
}

.support{
  background:#fee2e2;
  color:#991b1b;
}

.result-table{
  width:100%;
  max-width:700px;
  margin:20px auto;
  border-collapse:collapse;
}

.result-table th,
.result-table td{
  padding:12px;
  border-bottom:1px solid #e2e8f0;
}

.result-table th{
  background:#f8fafc;
}

.return-btn{
  margin-top:18px;
  border:0;
  padding:14px 25px;
  border-radius:12px;
  background:#0284c7;
  color:white;
  font-weight:900;
  cursor:pointer;
}

@media(max-width:700px){

  .answers{
    grid-template-columns:1fr;
  }

  .level-map{
    grid-template-columns:1fr;
  }

  .picture{
    min-height:290px;
  }

  .student-bar{
    flex-direction:column;
  }

}
</style>
</head>

<body>

<header>

  <div class="brand">
    SENTENCE QUEST
  </div>

  <button class="back-btn" onclick="goBack()">
    ← YEAR 3
  </button>

</header>


<div class="wrapper">

  <!-- STUDENT -->

  <div class="student-bar">

    <div class="student-item">
      👤 Student:
      <strong id="displayName">Student</strong>
    </div>

    <div class="student-item">
      🏫 Class:
      <strong id="displayClass">Class</strong>
    </div>

    <div class="student-item">
      🎯 Mission:
      <strong>Prepositions</strong>
    </div>

  </div>


  <div class="mission-title">

    <div class="badge">
      YEAR 3 • GRAMMAR MISSION
    </div>

    <h1>
      PREPOSITIONS
    </h1>

    <p>
      Look • Think • Build • Write
    </p>

  </div>


  <div class="level-map">

    <div class="level-step active" id="map1">
      1 • WORD HUNT
    </div>

    <div class="level-step" id="map2">
      2 • PUZZLE
    </div>

    <div class="level-step" id="map3">
      3 • COMPLETE
    </div>

    <div class="level-step" id="map4">
      4 • BUILD
    </div>

    <div class="level-step" id="map5">
      5 • MY SENTENCE
    </div>

  </div>


  <div class="status-row">

    <span id="statusLevel">
      Level 1 • Question 1/10
    </span>

    <span id="statusScore">
      Score: 0
    </span>

  </div>


  <div class="progress">

    <div
      class="progress-bar"
      id="progressBar">
    </div>

  </div>


  <div
    class="quiz-card"
    id="quizCard">

    <div
      class="level-label"
      id="levelLabel">
    </div>

    <h2
      class="question"
      id="question">
    </h2>


    <div
      class="picture"
      id="picture">
    </div>


    <div
      class="answers"
      id="answers">
    </div>


    <div
      class="feedback"
      id="feedback">
    </div>


    <div
      class="hint"
      id="hint">
    </div>


    <div class="controls">

      <button
        class="hint-btn"
        id="hintBtn"
        onclick="showHint()">

        💡 HINT

      </button>


      <button
        class="next-btn"
        id="nextBtn"
        onclick="nextQuestion()">

        NEXT QUESTION →

      </button>

    </div>

  </div>

</div>


<script>

/* =================================
   STUDENT INFORMATION
================================= */

const studentName =
localStorage.getItem(
  "sentenceQuestStudentName"
) || "Student";


const studentClass =
localStorage.getItem(
  "sentenceQuestStudentClass"
) || "-";


document
.getElementById("displayName")
.innerText = studentName;


document
.getElementById("displayClass")
.innerText = studentClass;



/* =================================
   QUESTION DATA
================================= */

const baseQuestions = [

{
 obj:"🐈",
 ref:"🪑",
 pos:"under",
 subject:"cat",
 place:"chair"
},

{
 obj:"⚽",
 ref:"📦",
 pos:"in",
 subject:"ball",
 place:"box"
},

{
 obj:"🎒",
 ref:"🪑",
 pos:"on",
 subject:"bag",
 place:"chair"
},

{
 obj:"🐕",
 ref:"🌳",
 pos:"behind",
 subject:"dog",
 place:"tree"
},

{
 obj:"👧",
 ref:"🌳",
 pos:"next to",
 subject:"girl",
 place:"tree"
},

{
 obj:"🐇",
 ref:"📦",
 pos:"in",
 subject:"rabbit",
 place:"box"
},

{
 obj:"📖",
 ref:"🪑",
 pos:"on",
 subject:"book",
 place:"chair"
},

{
 obj:"🐈",
 ref:"🌳",
 pos:"under",
 subject:"cat",
 place:"tree"
},

{
 obj:"🚲",
 ref:"🏠",
 pos:"next to",
 subject:"bicycle",
 place:"house"
},

{
 obj:"👦",
 ref:"🏠",
 pos:"in front of",
 subject:"boy",
 place:"house"
}

];


/* =================================
   STATE
================================= */

let level = 0;
let index = 0;

let score = 0;

let questionAttempts = 0;

let hints = 0;

let totalWrongAttempts = 0;

let levelScores = [0,0,0,0,0];

let levelHints = [0,0,0,0,0];

let levelSupport = [0,0,0,0,0];


const levelNames = [

"WORD HUNT",
"SENTENCE PUZZLE",
"COMPLETE IT!",
"PICTURE BUILDER",
"MY SENTENCE"

];


const positions = [

"in",
"on",
"under",
"behind",
"next to",
"in front of"

];


/* =================================
   START
================================= */

loadQuestion();



/* =================================
   LOAD QUESTION
================================= */

function loadQuestion(){

  questionAttempts = 0;

  resetUI();

  updateStatus();

  const data =
  baseQuestions[index];


  renderScene(data);


  document
  .getElementById("levelLabel")
  .innerText =
  "LEVEL " +
  (level + 1) +
  " • " +
  levelNames[level];


  if(level === 0){

    loadLevel1(data);

  }

  else if(level === 1){

    loadLevel2(data);

  }

  else if(level === 2){

    loadLevel3(data);

  }

  else if(level === 3){

    loadLevel4(data);

  }

  else{

    loadLevel5(data);

  }

}



/* =================================
   SENTENCE
================================= */

function getSentence(data){

  return (
    "The " +
    data.subject +
    " is " +
    data.pos +
    " the " +
    data.place +
    "."
  );

}



/* =================================
   SCENE
================================= */

function renderScene(data){

  const picture =
  document.getElementById("picture");


  picture.innerHTML = `

    <div class="scene-title">
      LOOK AT THE PICTURE
    </div>

    <div class="sun">
      ☀️
    </div>

    <div class="cloud">
      ☁️
    </div>

    <div
      class="reference"
      id="reference">
      ${data.ref}
    </div>

    <div
      class="object"
      id="object">
      ${data.obj}
    </div>

  `;


  const ref =
  document.getElementById("reference");

  const obj =
  document.getElementById("object");


  ref.style.left = "50%";
  ref.style.bottom = "35px";
  ref.style.transform =
  "translateX(-50%)";


  if(data.pos === "under"){

    obj.style.left = "50%";
    obj.style.bottom = "5px";
    obj.style.transform =
    "translateX(-50%)";

  }


  else if(data.pos === "on"){

    obj.style.left = "50%";
    obj.style.bottom = "155px";
    obj.style.transform =
    "translateX(-50%)";

  }


  else if(data.pos === "in"){

    obj.style.left = "50%";
    obj.style.bottom = "45px";
    obj.style.transform =
    "translateX(-50%) scale(.7)";

  }


  else if(data.pos === "behind"){

    obj.style.left = "54%";
    obj.style.bottom = "45px";
    obj.style.transform =
    "translateX(-50%) scale(.75)";

    obj.style.zIndex = "2";
    ref.style.zIndex = "4";

  }


  else if(data.pos === "next to"){

    obj.style.left = "25%";
    obj.style.bottom = "38px";

  }


  else if(data.pos === "in front of"){

    obj.style.left = "50%";
    obj.style.bottom = "10px";
    obj.style.transform =
    "translateX(-50%)";

    obj.style.zIndex = "6";

  }

}



/* =================================
   LEVEL 1
================================= */

function loadLevel1(data){

  document
  .getElementById("question")
  .innerText =
  "Where is the " +
  data.subject +
  "?";


  const wrong =
  positions
  .filter(x => x !== data.pos)
  .sort(() => Math.random() - .5)
  .slice(0,2);


  createOptions(
    shuffle([
      data.pos,
      ...wrong
    ]),
    data.pos
  );

}



/* =================================
   LEVEL 2
================================= */

function loadLevel2(data){

  document
  .getElementById("question")
  .innerText =
  "Which sentence is in the correct order?";


  const correct =
  getSentence(data);


  const words =
  correct
  .replace(".","")
  .split(" ");


  const wrong1 =
  [...words]
  .reverse()
  .join(" ") +
  ".";


  let wrong2 =
  shuffle([...words])
  .join(" ") +
  ".";


  if(wrong2 === correct){

    wrong2 =
    "Is the " +
    data.subject +
    " " +
    data.pos +
    " the " +
    data.place +
    ".";

  }


  createOptions(

    shuffle([
      correct,
      wrong1,
      wrong2
    ]),

    correct

  );

}



/* =================================
   LEVEL 3
================================= */

function loadLevel3(data){

  document
  .getElementById("question")
  .innerText =
  "The " +
  data.subject +
  " is _____ the " +
  data.place +
  ".";


  const wrong =
  positions
  .filter(x => x !== data.pos)
  .sort(() => Math.random() - .5)
  .slice(0,2);


  createOptions(

    shuffle([
      data.pos,
      ...wrong
    ]),

    data.pos

  );

}



/* =================================
   LEVEL 4
================================= */

function loadLevel4(data){

  document
  .getElementById("question")
  .innerText =
  "Choose the best sentence for the picture.";


  const correct =
  getSentence(data);


  const wrongPositions =
  positions
  .filter(x => x !== data.pos)
  .sort(() => Math.random() - .5)
  .slice(0,2);


  const wrong =
  wrongPositions.map(pos =>

    "The " +
    data.subject +
    " is " +
    pos +
    " the " +
    data.place +
    "."

  );


  createOptions(

    shuffle([
      correct,
      ...wrong
    ]),

    correct

  );

}



/* =================================
   LEVEL 5
================================= */

function loadLevel5(data){

  document
  .getElementById("question")
  .innerText =
  "Look at the picture. Write one complete sentence.";


  document
  .getElementById("answers")
  .innerHTML = `

    <div class="write-box">

      <textarea
        id="studentSentence"
        placeholder="Write your sentence here...">
      </textarea>

      <button
        class="check-btn"
        id="checkWritingBtn"
        onclick="checkWriting()">

        CHECK MY SENTENCE

      </button>

      <div class="small-note">
        Capital letter • Complete idea • Full stop
      </div>

    </div>

  `;

}



/* =================================
   CREATE OPTIONS
================================= */

function createOptions(
  options,
  correct
){

  const area =
  document.getElementById(
    "answers"
  );


  area.innerHTML = "";


  options.forEach(option => {

    const button =
    document.createElement(
      "button"
    );


    button.className =
    "answer";


    button.innerText =
    option;


    button.onclick =
    function(){

      checkOption(
        button,
        option,
        correct
      );

    };


    area.appendChild(
      button
    );

  });

}



/* =================================
   CHECK MCQ
================================= */

function checkOption(
  button,
  selected,
  correct
){

  questionAttempts++;


  if(selected === correct){

    button
    .classList
    .add("correct");


    /*
      2 POINTS:
      correct first attempt

      1 POINT:
      correct second attempt
    */

    const points =
    questionAttempts === 1
    ? 2
    : 1;


    score += points;

    levelScores[level] += points;


    disableAnswers();


    const feedback =
    document.getElementById(
      "feedback"
    );


    feedback.className =
    "feedback good";


    if(points === 2){

      feedback.innerHTML =
      "⭐ Excellent! Correct on your first try!";

    }

    else{

      feedback.innerHTML =
      "👍 Well done! You found the correct answer.";

    }


    showNext();


    updateScore();

  }

  else{

    totalWrongAttempts++;


    button
    .classList
    .add("wrong");


    button.disabled = true;


    if(questionAttempts === 1){

      const feedback =
      document.getElementById(
        "feedback"
      );


      feedback.className =
      "feedback bad";


      feedback.innerHTML =
      "Good try! Look carefully and try one more time.";


      /*
        Automatically show hint
        after first wrong answer.
      */

      showHint();

    }


    else{

      /*
        SECOND WRONG ANSWER

        SHOW CORRECT ANSWER
        AND ALLOW STUDENT TO CONTINUE
      */

      levelSupport[level]++;


      revealCorrectAnswer(correct);


      const feedback =
      document.getElementById(
        "feedback"
      );


      feedback.className =
      "feedback learn";


      feedback.innerHTML =

      "💡 <b>Let's learn!</b><br>" +

      "The correct answer is:<br><br>" +

      "<b>" +
      correct +
      "</b><br><br>" +

      "Read the answer carefully before you continue.";


      disableAnswers();


      showNext();

    }

  }

}



/* =================================
   REVEAL ANSWER
================================= */

function revealCorrectAnswer(
  correct
){

  document
  .querySelectorAll(".answer")
  .forEach(button => {

    if(
      button.innerText.trim()
      ===
      correct.trim()
    ){

      button
      .classList
      .add("correct");

    }

  });

}



/* =================================
   LEVEL 5 WRITING
================================= */

function checkWriting(){

  const textarea =
  document.getElementById(
    "studentSentence"
  );


  let answer =
  textarea
  .value
  .toLowerCase()
  .trim()
  .replace(/[.!?]/g,"")
  .replace(/\s+/g," ");


  if(answer === ""){

    const feedback =
    document.getElementById(
      "feedback"
    );


    feedback.className =
    "feedback bad";


    feedback.innerHTML =
    "Write a sentence first.";

    return;

  }


  questionAttempts++;


  const data =
  baseQuestions[index];


  const correct =
  (
    "the " +
    data.subject +
    " is " +
    data.pos +
    " the " +
    data.place
  );


  const accepted = [

    correct,

    (
      "a " +
      data.subject +
      " is " +
      data.pos +
      " the " +
      data.place
    ),

    (
      "there is a " +
      data.subject +
      " " +
      data.pos +
      " the " +
      data.place
    )

  ];


  if(
    accepted.includes(answer)
  ){

    const points =
    questionAttempts === 1
    ? 2
    : 1;


    score += points;

    levelScores[level] += points;


    const feedback =
    document.getElementById(
      "feedback"
    );


    feedback.className =
    "feedback good";


    if(points === 2){

      feedback.innerHTML =
      "🏆 Fantastic! You wrote the sentence independently!";

    }

    else{

      feedback.innerHTML =
      "👍 Great! Your sentence is correct.";

    }


    document
    .getElementById(
      "checkWritingBtn"
    )
    .disabled = true;


    textarea.disabled = true;


    showNext();

    updateScore();

  }

  else{

    totalWrongAttempts++;


    if(questionAttempts === 1){

      const feedback =
      document.getElementById(
        "feedback"
      );


      feedback.className =
      "feedback bad";


      feedback.innerHTML =
      "Good try! Check WHO/WHAT + IS + WHERE and try one more time.";


      showHint();

    }


    else{

      levelSupport[level]++;


      const feedback =
      document.getElementById(
        "feedback"
      );


      feedback.className =
      "feedback learn";


      feedback.innerHTML =

      "💡 <b>Let's learn from an example.</b><br><br>" +

      "Suggested sentence:<br>" +

      "<b>" +
      getSentence(data) +
      "</b><br><br>" +

      "Read the sentence, then continue to the next question.";


      document
      .getElementById(
        "checkWritingBtn"
      )
      .disabled = true;


      textarea.disabled = true;


      showNext();

    }

  }

}



/* =================================
   HINT
================================= */

function showHint(){

  const hint =
  document.getElementById(
    "hint"
  );


  /*
    Count hint only once
    per question.
  */

  if(
    hint.style.display !==
    "block"
  ){

    hints++;

    levelHints[level]++;

  }


  hint.style.display =
  "block";


  const data =
  baseQuestions[index];


  if(level === 0){

    if(data.pos === "under"){

      hint.innerText =
      "Look below the object.";

    }

    else if(data.pos === "in"){

      hint.innerText =
      "Look inside the object.";

    }

    else if(data.pos === "on"){

      hint.innerText =
      "Look above and touching the object.";

    }

    else if(data.pos === "behind"){

      hint.innerText =
      "One object is at the back.";

    }

    else if(data.pos === "next to"){

      hint.innerText =
      "The two things are beside each other.";

    }

    else{

      hint.innerText =
      "One object is in front of the other.";

    }

  }


  else if(level === 1){

    hint.innerText =
    "Start with: The " +
    data.subject +
    " is ...";

  }


  else if(level === 2){

    hint.innerText =
    "Look carefully at the position in the picture.";

  }


  else if(level === 3){

    hint.innerText =
    "Think: WHO/WHAT + IS + WHERE.";

  }


  else{

    hint.innerText =
    "Start with: The " +
    data.subject +
    " is ...";

  }


  document
  .getElementById(
    "hintBtn"
  )
  .style.display =
  "none";

}



/* =================================
   NEXT QUESTION
================================= */

function nextQuestion(){

  if(index < 9){

    index++;

  }

  else{

    document
    .getElementById(
      "map" +
      (level + 1)
    )
    .classList
    .remove("active");


    document
    .getElementById(
      "map" +
      (level + 1)
    )
    .classList
    .add("done");


    if(level < 4){

      level++;

      index = 0;


      document
      .getElementById(
        "map" +
        (level + 1)
      )
      .classList
      .add("active");

    }

    else{

      showResult();

      return;

    }

  }


  loadQuestion();

}



/* =================================
   STATUS
================================= */

function updateStatus(){

  document
  .getElementById(
    "statusLevel"
  )
  .innerText =

  "Level " +
  (level + 1) +
  " • Question " +
  (index + 1) +
  "/10";


  const completed =
  (level * 10) +
  index;


  document
  .getElementById(
    "progressBar"
  )
  .style.width =

  Math.max(
    2,
    (completed / 50) * 100
  ) +
  "%";

}



/* =================================
   SCORE
================================= */

function updateScore(){

  document
  .getElementById(
    "statusScore"
  )
  .innerText =

  "Points: " +
  score +
  "/100";

}



/* =================================

================================= */

function resetUI(){

  const feedback =

  );


  feedback.className =

  document
  .getElementById(
    "hint"

  document
  .getElementById(
    "hintBtn"
  )
  .style.display =

  .getElementById(
    "nextBtn"
  )

function shuffle(array){

    () => Math.random() - .5
  );
