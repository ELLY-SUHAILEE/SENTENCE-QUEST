<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Prepositions Mission | Sentence Quest
</title>

<style>

/* =====================================
   BASIC
===================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
  linear-gradient(
    135deg,
    #e0f2fe,
    #f8fafc,
    #fff7ed
  );
  color:#17324d;
  min-height:100vh;
}


/* =====================================
   HEADER
===================================== */

header{

  background:
  linear-gradient(
    135deg,
    #075985,
    #0284c7
  );

  color:white;

  padding:13px 4%;

  display:flex;

  justify-content:space-between;

  align-items:center;

  box-shadow:
  0 4px 15px
  rgba(0,0,0,.12);

}


.brand{

  font-size:21px;

  font-weight:900;

  letter-spacing:.3px;

}


.back-btn{

  border:
  1px solid
  rgba(255,255,255,.5);

  background:
  rgba(255,255,255,.15);

  color:white;

  padding:
  9px 16px;

  border-radius:10px;

  cursor:pointer;

  font-weight:bold;

}


/* =====================================
   WRAPPER
===================================== */

.wrapper{

  max-width:1200px;

  margin:auto;

  padding:
  15px 22px 30px;

}


/* =====================================
   STUDENT BAR
===================================== */

.student-bar{

  background:white;

  border-radius:14px;

  padding:
  11px 18px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  margin-bottom:13px;

  box-shadow:
  0 5px 15px
  rgba(15,23,42,.08);

}


.student-item{

  font-size:14px;

  color:#64748b;

}


.student-item strong{

  color:#075985;

  font-size:15px;

}


/* =====================================
   TITLE
===================================== */

.mission-title{

  text-align:center;

  margin-bottom:12px;

}


.badge{

  display:inline-block;

  background:#dcfce7;

  color:#166534;

  padding:
  5px 13px;

  border-radius:20px;

  font-size:12px;

  font-weight:900;

  margin-bottom:5px;

}


.mission-title h1{

  color:#075985;

  font-size:32px;

  line-height:1;

}


.mission-title p{

  color:#64748b;

  margin-top:6px;

  font-size:14px;

}


/* =====================================
   LEVEL MAP
===================================== */

.level-map{

  display:grid;

  grid-template-columns:
  repeat(5,1fr);

  gap:8px;

  margin:
  13px 0;

}


.level-step{

  background:white;

  color:#94a3b8;

  padding:
  9px 5px;

  border-radius:9px;

  text-align:center;

  font-size:11px;

  font-weight:900;

  border:
  1px solid
  #e2e8f0;

}


.level-step.active{

  background:#0284c7;

  color:white;

  border-color:#0284c7;

}


.level-step.done{

  background:#dcfce7;

  color:#166534;

  border-color:#86efac;

}


/* =====================================
   STATUS
===================================== */

.status-box{

  background:white;

  padding:
  10px 16px;

  border-radius:12px;

  box-shadow:
  0 4px 12px
  rgba(15,23,42,.06);

  margin-bottom:10px;

}


.status-row{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  font-weight:bold;

  font-size:14px;

  margin-bottom:7px;

}


.progress{

  width:100%;

  height:11px;

  background:#e2e8f0;

  border-radius:20px;

  overflow:hidden;

}


.progress-bar{

  height:100%;

  width:2%;

  background:
  linear-gradient(
    90deg,
    #22c55e,
    #0ea5e9
  );

  transition:.35s;

}


/* =====================================
   QUIZ CARD
===================================== */

.quiz-card{

  background:white;

  border-radius:20px;

  padding:
  17px 25px 20px;

  box-shadow:
  0 8px 25px
  rgba(15,23,42,.11);

}


.level-label{

  text-align:center;

  color:#0284c7;

  font-size:12px;

  font-weight:900;

  letter-spacing:1px;

}


.question{

  text-align:center;

  font-size:25px;

  margin:
  5px 0 12px;

  line-height:1.3;

  color:#172554;

}


/* =====================================
   PICTURE
===================================== */

.picture-frame{

  width:100%;

  max-width:540px;

  margin:
  0 auto 15px;

  background:white;

  border:
  2px solid
  #38bdf8;

  border-radius:16px;

  padding:7px;

  box-shadow:
  0 5px 15px
  rgba(15,23,42,.08);

}


.picture{

  width:100%;

  height:260px;

  border-radius:11px;

  overflow:hidden;

  background:white;

  display:flex;

  justify-content:center;

  align-items:center;

}


.picture img{

  width:100%;

  height:100%;

  object-fit:contain;

  display:block;

  border-radius:9px;

}


.picture-label{

  text-align:center;

  margin-top:6px;

  padding:6px;

  background:#e0f2fe;

  color:#075985;

  border-radius:7px;

  font-size:12px;

  font-weight:900;

}


/* =====================================
   ANSWERS
===================================== */

.answers{

  display:grid;

  grid-template-columns:
  repeat(2,1fr);

  gap:10px;

  max-width:1000px;

  margin:auto;

}


.answer{

  border:
  2px solid
  #bfdbfe;

  background:#ffffff;

  padding:
  13px 16px;

  border-radius:12px;

  font-size:17px;

  font-weight:bold;

  cursor:pointer;

  transition:.2s;

  line-height:1.3;

  min-height:52px;

}


.answer:hover{

  border-color:#38bdf8;

  background:#f0f9ff;

  transform:
  translateY(-1px);

}


.answer.correct{

  background:#dcfce7;

  border-color:#22c55e;

  color:#166534;

}


.answer.wrong{

  background:#fee2e2;

  border-color:#ef4444;

  color:#991b1b;

}


/* =====================================
   FEEDBACK
===================================== */

.feedback{

  display:none;

  text-align:center;

  margin:
  11px auto 0;

  max-width:1000px;

  padding:10px;

  border-radius:10px;

  font-weight:bold;

  line-height:1.5;

}


.feedback.good{

  display:block;

  background:#dcfce7;

  color:#166534;

}


.feedback.bad{

  display:block;

  background:#fff7ed;

  color:#9a3412;

}


.feedback.learn{

  display:block;

  background:#e0f2fe;

  color:#075985;

}


/* =====================================
   HINT
===================================== */

.hint{

  display:none;

  text-align:center;

  background:#fffbeb;

  color:#92400e;

  padding:10px;

  margin:
  10px auto 0;

  max-width:1000px;

  border-radius:10px;

  font-weight:bold;

}


/* =====================================
   CONTROLS
===================================== */

.controls{

  display:flex;

  gap:12px;

  margin:
  13px auto 0;

  max-width:800px;

}


.hint-btn,
.next-btn{

  flex:1;

  padding:12px;

  border:0;

  border-radius:11px;

  font-weight:900;

  cursor:pointer;

  font-size:15px;

}


.hint-btn{

  background:#fef3c7;

  color:#92400e;

  border:
  1px solid
  #fbbf24;

}


.next-btn{

  display:none;

  background:#0284c7;

  color:white;

}


/* =====================================
   WRITING
===================================== */

.write-box{

  grid-column:1/-1;

}


.write-box textarea{

  width:100%;

  min-height:95px;

  resize:none;

  border:
  2px solid
  #bae6fd;

  border-radius:12px;

  padding:13px;

  font-size:18px;

  outline:none;

}


.check-btn{

  width:100%;

  margin-top:8px;

  padding:12px;

  border:0;

  border-radius:11px;

  background:#22c55e;

  color:white;

  font-weight:900;

  font-size:15px;

  cursor:pointer;

}


.small-note{

  text-align:center;

  color:#64748b;

  margin-top:7px;

  font-size:12px;

}


/* =====================================
   RESULT
===================================== */

.result{

  text-align:center;

  padding:20px 5px;

}


.trophy{

  font-size:65px;

}


.result h1{

  color:#075985;

  margin-bottom:8px;

}


.student-result{

  max-width:600px;

  margin:
  17px auto;

  background:#f0f9ff;

  border-radius:15px;

  padding:14px;

}


.student-result-row{

  display:flex;

  justify-content:space-between;

  padding:7px 5px;

  border-bottom:
  1px dashed
  #bae6fd;

}


.student-result-row:last-child{

  border-bottom:none;

}


.total-score{

  font-size:40px;

  color:#16a34a;

  font-weight:900;

  margin:
  15px 0 3px;

}


.percentage{

  color:#64748b;

  margin-bottom:12px;

}


.mastery{

  display:inline-block;

  padding:
  9px 20px;

  border-radius:30px;

  font-weight:900;

  margin-bottom:15px;

}


.mastered{

  background:#dcfce7;

  color:#166534;

}


.developing{

  background:#fef3c7;

  color:#92400e;

}


.support{

  background:#fee2e2;

  color:#991b1b;

}


.result-table{

  width:100%;

  max-width:760px;

  margin:
  17px auto;

  border-collapse:collapse;

}


.result-table th,
.result-table td{

  padding:10px;

  border-bottom:
  1px solid
  #e2e8f0;

}


.result-table th{

  background:#f8fafc;

}


.return-btn{

  margin-top:15px;

  border:0;

  padding:
  13px 24px;

  border-radius:11px;

  background:#0284c7;

  color:white;

  font-weight:900;

  cursor:pointer;

}


/* =====================================
   MOBILE
===================================== */

@media(max-width:700px){

  .wrapper{
    padding:10px;
  }

  .student-bar{
    flex-direction:column;
    align-items:flex-start;
  }

  .mission-title h1{
    font-size:27px;
  }

  .level-map{
    grid-template-columns:
    repeat(5,1fr);
  }

  .level-step{
    font-size:8px;
    padding:8px 2px;
  }

  .quiz-card{
    padding:13px;
  }

  .question{
    font-size:21px;
  }

  .picture-frame{
    max-width:100%;
  }

  .picture{
    height:220px;
  }

  .picture img{
    width:100%;
    height:100%;
    object-fit:contain;
  }

  .answers{
    grid-template-columns:1fr;
  }

  .controls{
    flex-direction:column;
  }

}


/* =====================================
   SMALL PHONE
===================================== */

@media(max-width:430px){

  .picture{
    height:190px;
  }

  .mission-title h1{
    font-size:24px;
  }

  .question{
    font-size:19px;
  }

  .answer{
    font-size:16px;
    padding:11px;
  }

}

</style>

</head>


<body>


<!-- =================================
     HEADER
================================= -->

<header>

  <div class="brand">
    📖 SENTENCE QUEST
  </div>


  <button
    class="back-btn"
    onclick="goBack()">

    ← YEAR 3

  </button>

</header>


<div class="wrapper">


<!-- =================================
     STUDENT BAR
================================= -->

<div class="student-bar">

  <div class="student-item">

    👤 Student:

    <strong id="displayName">
      Student
    </strong>

  </div>


  <div class="student-item">

    🏫 Class:

    <strong id="displayClass">
      Class
    </strong>

  </div>


  <div class="student-item">

    🎯 Mission:

    <strong>
      Prepositions
    </strong>

  </div>

</div>


<!-- =================================
     TITLE
================================= -->

<div class="mission-title">

  <div class="badge">

    YEAR 3 • GRAMMAR MISSION

  </div>


  <h1>

    PREPOSITIONS

  </h1>


  <p>

    Look • Think • Build • Write

  </p>

</div>


<!-- =================================
     LEVEL MAP
================================= -->

<div class="level-map">


  <div
    class="level-step active"
    id="map1">

    1 • WORD HUNT

  </div>


  <div
    class="level-step"
    id="map2">

    2 • PUZZLE

  </div>


  <div
    class="level-step"
    id="map3">

    3 • COMPLETE

  </div>


  <div
    class="level-step"
    id="map4">

    4 • BUILD

  </div>


  <div
    class="level-step"
    id="map5">

    5 • MY SENTENCE

  </div>


</div>


<!-- =================================
     STATUS
================================= -->

<div class="status-box">

  <div class="status-row">

    <span id="statusLevel">

      Level 1 • Question 1/10

    </span>


    <span id="statusScore">

      ⭐ Points: 0/100

    </span>

  </div>


  <div class="progress">

    <div
      class="progress-bar"
      id="progressBar">
    </div>

  </div>

</div>


<!-- =================================
     QUIZ
================================= -->

<div
  class="quiz-card"
  id="quizCard">


  <div
    class="level-label"
    id="levelLabel">
  </div>


  <h2
    class="question"
    id="question">
  </h2>


  <!-- PICTURE -->

  <div class="picture-frame">

    <div
      class="picture"
      id="picture">
    </div>


    <div class="picture-label">

      👁️ LOOK CAREFULLY AT THE PICTURE

    </div>

  </div>


  <!-- ANSWERS -->

  <div
    class="answers"
    id="answers">
  </div>


  <!-- FEEDBACK -->

  <div
    class="feedback"
    id="feedback">
  </div>


  <!-- HINT -->

  <div
    class="hint"
    id="hint">
  </div>


  <!-- BUTTONS -->

  <div class="controls">


    <button
      class="hint-btn"
      id="hintBtn"
      onclick="showHint()">

      💡 HINT

    </button>


    <button
      class="next-btn"
      id="nextBtn"
      onclick="nextQuestion()">

      NEXT QUESTION →

    </button>


  </div>


</div>

</div>


<script>


/* =====================================
   STUDENT INFORMATION
===================================== */

const studentName =

localStorage.getItem(
  "sentenceQuestStudentName"
)

|| "Student";


const studentClass =

localStorage.getItem(
  "sentenceQuestStudentClass"
)

|| "-";


document
.getElementById(
  "displayName"
)
.innerText =
studentName;


document
.getElementById(
  "displayClass"
)
.innerText =
studentClass;



/* =====================================
   QUESTION DATA
===================================== */

const baseQuestions = [


{
  image:"q1-under.png",
  pos:"under",
  subject:"cat",
  place:"chair"
},


{
  image:"q2-in.png",
  pos:"in",
  subject:"ball",
  place:"box"
},


{
  image:"q3-on.png",
  pos:"on",
  subject:"book",
  place:"table"
},


{
  image:"q4-behind.png",
  pos:"behind",
  subject:"dog",
  place:"tree"
},


{
  image:"q5-next-to.png",
  pos:"next to",
  subject:"girl",
  place:"plant"
},


{
  image:"q6-in-front-of.png",
  pos:"in front of",
  subject:"boy",
  place:"house"
},


{
  image:"q7-between.png",
  pos:"between",
  subject:"teddy bear",
  place:"pillows"
},


{
  image:"q8-near.png",
  pos:"near",
  subject:"rabbit",
  place:"flowers"
},


{
  image:"q9-above.png",
  pos:"above",
  subject:"kite",
  place:"clouds"
},


{
  image:"q10-below.png",
  pos:"below",
  subject:"house",
  place:"balloon"
}


];



/* =====================================
   PREPOSITIONS
===================================== */

const positions = [

"under",

"in",

"on",

"behind",

"next to",

"in front of",

"between",

"near",

"above",

"below"

];



/* =====================================
   STATE
===================================== */

let level = 0;

let index = 0;

let score = 0;

let questionAttempts = 0;

let hints = 0;

let totalWrongAttempts = 0;


let levelScores =

[0,0,0,0,0];


let levelHints =

[0,0,0,0,0];


let levelSupport =

[0,0,0,0,0];


const levelNames = [

"WORD HUNT",

"SENTENCE PUZZLE",

"COMPLETE IT!",

"PICTURE BUILDER",

"MY SENTENCE"

];



/* =====================================
   START
===================================== */

loadQuestion();



/* =====================================
   LOAD QUESTION
===================================== */

function loadQuestion(){


  questionAttempts = 0;


  resetUI();


  updateStatus();


  const data =

  baseQuestions[index];


  renderPicture(data);


  document
  .getElementById(
    "levelLabel"
  )
  .innerText =

  "LEVEL " +

  (level + 1) +

  " • " +

  levelNames[level];


  if(level === 0){

    loadLevel1(data);

  }


  else if(level === 1){

    loadLevel2(data);

  }


  else if(level === 2){

    loadLevel3(data);

  }


  else if(level === 3){

    loadLevel4(data);

  }


  else{

    loadLevel5(data);

  }


}



/* =====================================
   RENDER IMAGE
===================================== */

function renderPicture(data){


  document
  .getElementById(
    "picture"
  )
  .innerHTML = `

    <img

      src="${data.image}"

      alt="Prepositions picture"

      loading="eager"

      onerror="imageError(this)"

    >

  `;


}



/* =====================================
   IMAGE ERROR
===================================== */

function imageError(img){


  const picture =

  document
  .getElementById(
    "picture"
  );


  picture.innerHTML = `


    <div style="
      text-align:center;
      padding:30px;
      color:#b91c1c;
      font-weight:bold;
    ">


      ⚠️ Picture could not be loaded.


      <br><br>


      File:


      <br>


      ${img.getAttribute("src")}


    </div>


  `;


}



/* =====================================
   SENTENCE
===================================== */

function getSentence(data){


  return (

    "The " +

    data.subject +

    " is " +

    data.pos +

    " the " +

    data.place +

    "."

  );


}



/* =====================================
   LEVEL 1
===================================== */

function loadLevel1(data){


  document
  .getElementById(
    "question"
  )
  .innerText =

  "Where is the " +

  data.subject +

  "?";


  const wrong =

  positions

  .filter(

    item =>

    item !== data.pos

  )

  .sort(

    () =>

    Math.random() - .5

  )

  .slice(

    0,

    3

  );


  createOptions(

    shuffle([

      data.pos,

      ...wrong

    ]),

    data.pos

  );


}



/* =====================================
   LEVEL 2
===================================== */

function loadLevel2(data){


  document
  .getElementById(
    "question"
  )
  .innerText =

  "Which sentence is in the correct order?";


  const correct =

  getSentence(data);


  const words =

  correct

  .replace(
    ".",
    ""
  )

  .split(
    " "
  );


  const wrong1 =

  [...words]

  .reverse()

  .join(
    " "
  )

  + ".";


  let wrong2 =

  shuffle(
    [...words]
  )

  .join(
    " "
  )

  + ".";


  if(

    wrong2 === correct

  ){


    wrong2 =

    "Is the " +

    data.subject +

    " " +

    data.pos +

    " the " +

    data.place +

    ".";


  }


  createOptions(

    shuffle([

      correct,

      wrong1,

      wrong2

    ]),

    correct

  );


}



/* =====================================
   LEVEL 3
===================================== */

function loadLevel3(data){


  document
  .getElementById(
    "question"
  )
  .innerText =

  "The " +

  data.subject +

  " is _____ the " +

  data.place +

  ".";


  const wrong =

  positions

  .filter(

    item =>

    item !== data.pos

  )

  .sort(

    () =>

    Math.random() - .5

  )

  .slice(

    0,

    3

  );


  createOptions(

    shuffle([

      data.pos,

      ...wrong

    ]),

    data.pos

  );


}



/* =====================================
   LEVEL 4
===================================== */

function loadLevel4(data){


  document
  .getElementById(
    "question"
  )
  .innerText =

  "Choose the best sentence for the picture.";


  const correct =

  getSentence(data);


  const wrongPositions =

  positions

  .filter(

    item =>

    item !== data.pos

  )

  .sort(

    () =>

    Math.random() - .5

  )

  .slice(

    0,

    3

  );


  const wrong =

  wrongPositions

  .map(

    position =>

    "The " +

    data.subject +

    " is " +

    position +

    " the " +

    data.place +

    "."

  );


  createOptions(

    shuffle([

      correct,

      ...wrong

    ]),

    correct

  );


}



/* =====================================
   LEVEL 5
===================================== */

function loadLevel5(data){


  document
  .getElementById(
    "question"
  )
  .innerText =

  "Look at the picture. Write one complete sentence.";


  document
  .getElementById(
    "answers"
  )
  .innerHTML = `


    <div class="write-box">


      <textarea

        id="studentSentence"

        placeholder="Write your sentence here...">

      </textarea>


      <button

        class="check-btn"

        id="checkWritingBtn"

        onclick="checkWriting()">


        CHECK MY SENTENCE


      </button>


      <div class="small-note">


        Capital letter

        •

        Complete idea

        •

        Full stop


      </div>


    </div>


  `;


}



/* =====================================
   CREATE OPTIONS
===================================== */

function createOptions(

  options,

  correct

){


  const area =

  document
  .getElementById(
    "answers"
  );


  area.innerHTML = "";


  options.forEach(

    option => {


      const button =

      document.createElement(
        "button"
      );


      button.className =

      "answer";


      button.innerText =

      option;


      button.onclick =

      function(){


        checkOption(

          button,

          option,

          correct

        );


      };


      area.appendChild(

        button

      );


    }

  );


}



/* =====================================
   CHECK MCQ
===================================== */

function checkOption(

  button,

  selected,

  correct

){


  questionAttempts++;


  if(

    selected === correct

  ){


    button

    .classList

    .add(
      "correct"
    );


    const points =

    questionAttempts === 1

    ? 2

    : 1;


    score += points;


    levelScores[level]

    += points;


    disableAnswers();


    const feedback =

    document
    .getElementById(
      "feedback"
    );


    feedback.className =

    "feedback good";


    if(

      points === 2

    ){


      feedback.innerHTML =

      "⭐ Excellent! Correct on your first try!";


    }


    else{


      feedback.innerHTML =

      "👍 Well done! You found the correct answer.";


    }


    showNext();


    updateScore();


  }


  else{


    totalWrongAttempts++;


    button

    .classList

    .add(
      "wrong"
    );


    button.disabled =

    true;


    if(

      questionAttempts === 1

    ){


      const feedback =

      document
      .getElementById(
        "feedback"
      );


      feedback.className =

      "feedback bad";


      feedback.innerHTML =

      "Good try! Look carefully and try one more time.";


      showHint();


    }


    else{


      levelSupport[level]++;


      revealCorrectAnswer(
        correct
      );


      const feedback =

      document
      .getElementById(
        "feedback"
      );


      feedback.className =

      "feedback learn";


      feedback.innerHTML =


      "💡 <b>Let's learn!</b><br>" +


      "The correct answer is:<br><br>" +


      "<b>" +

      correct +

      "</b><br><br>" +


      "Read it carefully before you continue.";


      disableAnswers();


      showNext();


    }


  }


}



/* =====================================
   REVEAL ANSWER
===================================== */

function revealCorrectAnswer(

  correct

){


  document

  .querySelectorAll(
    ".answer"
  )

  .forEach(

    button => {


      if(

        button
        .innerText
        .trim()

        ===

        correct
        .trim()

      ){


        button

        .classList

        .add(
          "correct"
        );


      }


    }

  );


}



/* =====================================
   WRITING
===================================== */

function checkWriting(){


  const textarea =

  document
  .getElementById(
    "studentSentence"
  );


  let answer =

  textarea
  .value
  .toLowerCase()
  .trim()
  .replace(
    /[.!?]/g,
    ""
  )
  .replace(
    /\s+/g,
    " "
  );


  if(

    answer === ""

  ){


    const feedback =

    document
    .getElementById(
      "feedback"
    );


    feedback.className =

    "feedback bad";


    feedback.innerHTML =

    "Write a sentence first.";


    return;


  }


  questionAttempts++;


  const data =

  baseQuestions[index];


  const correct =

  getSentence(data)

  .toLowerCase()

  .replace(
    ".",
    ""
  );


  const accepted = [

    correct,

    correct.replace(

      /^the /,

      "a "

    )

  ];


  if(

    accepted.includes(
      answer
    )

  ){


    const points =

    questionAttempts === 1

    ? 2

    : 1;


    score += points;


    levelScores[level]

    += points;


    const feedback =

    document
    .getElementById(
      "feedback"
    );


    feedback.className =

    "feedback good";


    if(

      points === 2

    ){


      feedback.innerHTML =

      "🏆 Fantastic! You wrote the sentence independently!";


    }


    else{


      feedback.innerHTML =

      "👍 Great! Your sentence is correct.";


    }


    document

    .getElementById(
      "checkWritingBtn"
    )

    .disabled =

    true;


    textarea.disabled =

    true;


    showNext();


    updateScore();


  }


  else{


    totalWrongAttempts++;


    if(

      questionAttempts === 1

    ){


      const feedback =

      document
      .getElementById(
        "feedback"
      );


      feedback.className =

      "feedback bad";


      feedback.innerHTML =

      "Good try! Check WHO/WHAT + IS + WHERE and try one more time.";


      showHint();


    }


    else{


      levelSupport[level]++;


      const feedback =

      document
      .getElementById(
        "feedback"
      );


      feedback.className =

      "feedback learn";


      feedback.innerHTML =


      "💡 <b>Let's learn from an example.</b><br><br>" +


      "Suggested sentence:<br><br>" +


      "<b>" +

      getSentence(data) +

      "</b><br><br>" +


      "Read the sentence before continuing.";


      document

      .getElementById(
        "checkWritingBtn"
      )

      .disabled =

      true;


      textarea.disabled =

      true;


      showNext();


    }


  }


}



/* =====================================
   HINT
===================================== */

function showHint(){


  const hint =

  document
  .getElementById(
    "hint"
  );


  if(

    hint.style.display

    !==

    "block"

  ){


    hints++;


    levelHints[level]++;


  }


  hint.style.display =

  "block";


  const data =

  baseQuestions[index];


  const hintsByPosition = {


    "under":

    "Look below the object.",


    "in":

    "Look inside the object.",


    "on":

    "Look at the top surface.",


    "behind":

    "Look at the back.",


    "next to":

    "Look for two things beside each other.",


    "in front of":

    "Look for something standing before another object.",


    "between":

    "Look for something in the middle of two things.",


    "near":

    "Look for something close to another thing.",


    "above":

    "Look for something higher than another object.",


    "below":

    "Look for something lower than another object."


  };


  if(

    level === 0

    ||

    level === 2

  ){


    hint.innerText =

    hintsByPosition[
      data.pos
    ];


  }


  else if(

    level === 1

  ){


    hint.innerText =


    "Start with: The " +

    data.subject +

    " is ...";


  }


  else if(

    level === 3

  ){


    hint.innerText =

    "Think: WHO/WHAT + IS + WHERE.";


  }


  else{


    hint.innerText =


    "Start with: The " +

    data.subject +

    " is ...";


  }


  document

  .getElementById(
    "hintBtn"
  )

  .style.display =

  "none";


}



/* =====================================
   NEXT
===================================== */

function nextQuestion(){


  if(

    index < 9

  ){


    index++;


  }


  else{


    document

    .getElementById(

      "map" +

      (level + 1)

    )

    .classList

    .remove(
      "active"
    );


    document

    .getElementById(

      "map" +

      (level + 1)

    )

    .classList

    .add(
      "done"
    );


    if(

      level < 4

    ){


      level++;


      index = 0;


      document

      .getElementById(

        "map" +

        (level + 1)

      )

      .classList

      .add(
        "active"
      );


    }


    else{


      showResult();


      return;


    }


  }


  loadQuestion();


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });


}



/* =====================================
   STATUS
===================================== */

function updateStatus(){


  document

  .getElementById(
    "statusLevel"
  )

  .innerText =


  "Level " +

  (level + 1) +

  " • Question " +

  (index + 1) +

  "/10";


  const completed =

  (level * 10)

  +

  index;


  document

  .getElementById(
    "progressBar"
  )

  .style.width =


  Math.max(

    2,

    (completed / 50)

    * 100

  )

  + "%";


}



/* =====================================
   SCORE
===================================== */

function updateScore(){


  document

  .getElementById(
    "statusScore"
  )

  .innerText =


  "⭐ Points: " +

  score +

  "/100";


}



/* =====================================
   RESET
===================================== */

function resetUI(){


  const feedback =

  document
  .getElementById(
    "feedback"
  );


  feedback.className =

  "feedback";


  feedback.innerHTML =

  "";


  document

  .getElementById(
    "hint"
  )

  .style.display =

  "none";


  document

  .getElementById(
    "hintBtn"
  )

  .style.display =

  "block";


  document

  .getElementById(
    "nextBtn"
  )

  .style.display =

  "none";


}



/* =====================================
   DISABLE ANSWERS
===================================== */

function disableAnswers(){


  document

  .querySelectorAll(
    ".answer"
  )

  .forEach(

    button => {


      button.disabled =

      true;


    }

  );


}



/* =====================================
   SHOW NEXT
===================================== */

function showNext(){


  document

  .getElementById(
    "nextBtn"
  )

  .style.display =

  "block";


}



/* =====================================
   SHUFFLE
===================================== */

function shuffle(array){


  return array.sort(

    () =>

    Math.random() - .5

  );


}
