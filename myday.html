<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prepositions Mission | Sentence Quest</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#e0f2fe,#f8fafc,#fff7ed);
  color:#17324d;
  min-height:100vh;
}

header{
  background:linear-gradient(135deg,#075985,#0284c7);
  color:white;
  padding:13px 4%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 4px 15px rgba(0,0,0,.12);
}

.brand{
  font-size:21px;
  font-weight:900;
}

.back-btn{
  border:1px solid rgba(255,255,255,.5);
  background:rgba(255,255,255,.15);
  color:white;
  padding:9px 16px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.wrapper{
  max-width:1200px;
  margin:auto;
  padding:15px 22px 30px;
}

.student-bar{
  background:white;
  border-radius:14px;
  padding:11px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:13px;
  box-shadow:0 5px 15px rgba(15,23,42,.08);
}

.student-item{
  font-size:14px;
  color:#64748b;
}

.student-item strong{
  color:#075985;
  font-size:15px;
}

.mission-title{
  text-align:center;
  margin-bottom:12px;
}

.badge{
  display:inline-block;
  background:#dcfce7;
  color:#166534;
  padding:5px 13px;
  border-radius:20px;
  font-size:12px;
  font-weight:900;
  margin-bottom:5px;
}

.mission-title h1{
  color:#075985;
  font-size:32px;
  line-height:1;
}

.mission-title p{
  color:#64748b;
  margin-top:6px;
  font-size:14px;
}

.level-map{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin:13px 0;
}

.level-step{
  background:white;
  color:#94a3b8;
  padding:9px 5px;
  border-radius:9px;
  text-align:center;
  font-size:11px;
  font-weight:900;
  border:1px solid #e2e8f0;
}

.level-step.active{
  background:#0284c7;
  color:white;
  border-color:#0284c7;
}

.level-step.done{
  background:#dcfce7;
  color:#166534;
  border-color:#86efac;
}

.status-box{
  background:white;
  padding:10px 16px;
  border-radius:12px;
  box-shadow:0 4px 12px rgba(15,23,42,.06);
  margin-bottom:10px;
}

.status-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  font-weight:bold;
  font-size:14px;
  margin-bottom:7px;
}

.progress{
  width:100%;
  height:11px;
  background:#e2e8f0;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:2%;
  background:linear-gradient(90deg,#22c55e,#0ea5e9);
  transition:.35s;
}

.quiz-card{
  background:white;
  border-radius:20px;
  padding:17px 25px 20px;
  box-shadow:0 8px 25px rgba(15,23,42,.11);
}

.level-label{
  text-align:center;
  color:#0284c7;
  font-size:12px;
  font-weight:900;
  letter-spacing:1px;
}

.question{
  text-align:center;
  font-size:25px;
  margin:5px 0 12px;
  line-height:1.3;
  color:#172554;
}

/* PICTURE */

.picture-frame{
  width:100%;
  max-width:540px;
  margin:0 auto 15px;
  background:white;
  border:2px solid #38bdf8;
  border-radius:16px;
  padding:7px;
  box-shadow:0 5px 15px rgba(15,23,42,.08);
}

.picture{
  width:100%;
  height:260px;
  border-radius:11px;
  overflow:hidden;
  background:white;
  display:flex;
  justify-content:center;
  align-items:center;
}

.picture img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  border-radius:9px;
}

.picture-label{
  text-align:center;
  margin-top:6px;
  padding:6px;
  background:#e0f2fe;
  color:#075985;
  border-radius:7px;
  font-size:12px;
  font-weight:900;
}

/* ANSWERS */

.answers{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  max-width:1000px;
  margin:auto;
}

.answer{
  border:2px solid #bfdbfe;
  background:#ffffff;
  padding:13px 16px;
  border-radius:12px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
  line-height:1.3;
  min-height:52px;
}

.answer:hover{
  border-color:#38bdf8;
  background:#f0f9ff;
  transform:translateY(-1px);
}

.answer.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
}

.answer.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#991b1b;
}

.feedback{
  display:none;
  text-align:center;
  margin:11px auto 0;
  max-width:1000px;
  padding:10px;
  border-radius:10px;
  font-weight:bold;
  line-height:1.5;
}

.feedback.good{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.feedback.bad{
  display:block;
  background:#fff7ed;
  color:#9a3412;
}

.feedback.learn{
  display:block;
  background:#e0f2fe;
  color:#075985;
}

.hint{
  display:none;
  text-align:center;
  background:#fffbeb;
  color:#92400e;
  padding:10px;
  margin:10px auto 0;
  max-width:1000px;
  border-radius:10px;
  font-weight:bold;
}

.controls{
  display:flex;
  gap:12px;
  margin:13px auto 0;
  max-width:800px;
}

.hint-btn,
.next-btn{
  flex:1;
  padding:12px;
  border:0;
  border-radius:11px;
  font-weight:900;
  cursor:pointer;
  font-size:15px;
}

.hint-btn{
  background:#fef3c7;
  color:#92400e;
  border:1px solid #fbbf24;
}

.next-btn{
  display:none;
  background:#0284c7;
  color:white;
}

/* WRITING */

.write-box{
  grid-column:1/-1;
}

.write-box textarea{
  width:100%;
  min-height:95px;
  resize:none;
  border:2px solid #bae6fd;
  border-radius:12px;
  padding:13px;
  font-size:18px;
  outline:none;
}

.check-btn{
  width:100%;
  margin-top:8px;
  padding:12px;
  border:0;
  border-radius:11px;
  background:#22c55e;
  color:white;
  font-weight:900;
  font-size:15px;
  cursor:pointer;
}

.small-note{
  text-align:center;
  color:#64748b;
  margin-top:7px;
  font-size:12px;
}

/* RESULT */

.result{
  text-align:center;
  padding:20px 5px;
}

.trophy{
  font-size:65px;
}

.result h1{
  color:#075985;
  margin-bottom:8px;
}

.student-result{
  max-width:600px;
  margin:17px auto;
  background:#f0f9ff;
  border-radius:15px;
  padding:14px;
}

.student-result-row{
  display:flex;
  justify-content:space-between;
  padding:7px 5px;
  border-bottom:1px dashed #bae6fd;
}

.student-result-row:last-child{
  border-bottom:none;
}

.total-score{
  font-size:40px;
  color:#16a34a;
  font-weight:900;
  margin:15px 0 3px;
}

.percentage{
  color:#64748b;
  margin-bottom:12px;
}

.mastery{
  display:inline-block;
  padding:9px 20px;
  border-radius:30px;
  font-weight:900;
  margin-bottom:15px;
}

.mastered{
  background:#dcfce7;
  color:#166534;
}

.developing{
  background:#fef3c7;
  color:#92400e;
}

.support{
  background:#fee2e2;
  color:#991b1b;
}

.result-table{
  width:100%;
  max-width:760px;
  margin:17px auto;
  border-collapse:collapse;
}

.result-table th,
.result-table td{
  padding:10px;
  border-bottom:1px solid #e2e8f0;
}

.result-table th{
  background:#f8fafc;
}

.save-status{
  margin:15px auto;
  padding:12px;
  max-width:520px;
  background:#f0fdf4;
  border-radius:10px;
  font-weight:bold;
  color:#166534;
}

.return-btn{
  margin-top:15px;
  border:0;
  padding:13px 24px;
  border-radius:11px;
  background:#0284c7;
  color:white;
  font-weight:900;
  cursor:pointer;
}

@media(max-width:700px){

  .wrapper{
    padding:10px;
  }

  .student-bar{
    flex-direction:column;
    align-items:flex-start;
  }

  .mission-title h1{
    font-size:27px;
  }

  .level-map{
    grid-template-columns:repeat(5,1fr);
  }

  .level-step{
    font-size:8px;
    padding:8px 2px;
  }

  .quiz-card{
    padding:13px;
  }

  .question{
    font-size:21px;
  }

  .picture-frame{
    max-width:100%;
  }

  .picture{
    height:220px;
  }

  .answers{
    grid-template-columns:1fr;
  }

  .controls{
    flex-direction:column;
  }
}

@media(max-width:430px){

  .picture{
    height:190px;
  }

  .mission-title h1{
    font-size:24px;
  }

  .question{
    font-size:19px;
  }

  .answer{
    font-size:16px;
    padding:11px;
  }
}


.myday-scene{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:28px;
  padding:14px;
  background:linear-gradient(135deg,#eff6ff,#fff7ed);
}
.routine-visual{
  min-width:180px;
  text-align:center;
}
.routine-emoji{
  font-size:92px;
  line-height:1;
  filter:drop-shadow(0 5px 5px rgba(0,0,0,.12));
}
.subject-chip{
  display:inline-block;
  margin-top:10px;
  padding:7px 14px;
  border-radius:20px;
  background:white;
  color:#075985;
  font-weight:900;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}
.clock-wrap{
  width:190px;
  height:190px;
  flex:0 0 190px;
}
.clock-wrap svg{
  width:100%;
  height:100%;
  filter:drop-shadow(0 6px 8px rgba(0,0,0,.13));
}
@media(max-width:700px){
  .myday-scene{gap:12px;padding:8px}
  .routine-visual{min-width:120px}
  .routine-emoji{font-size:66px}
  .clock-wrap{width:135px;height:135px;flex-basis:135px}
}
@media(max-width:430px){
  .routine-emoji{font-size:56px}
  .clock-wrap{width:115px;height:115px;flex-basis:115px}
  .subject-chip{font-size:12px}
}

</style>
</head>

<body>

<header>

  <div class="brand">
    📖 SENTENCE QUEST
  </div>

  <button
    class="back-btn"
    onclick="goBack()">
    ← YEAR 3
  </button>

</header>


<div class="wrapper">

<div class="student-bar">

  <div class="student-item">
    👤 Student:
    <strong id="displayName">Student</strong>
  </div>

  <div class="student-item">
    🏫 Class:
    <strong id="displayClass">Class</strong>
  </div>

  <div class="student-item">
    🎯 Mission:
    <strong>My Day</strong>
  </div>

</div>


<div class="mission-title">

  <div class="badge">
    YEAR 3 • MODULE 2 MISSION
  </div>

  <h1>MY DAY</h1>

  <p>
    Look • Think • Build • Write
  </p>

</div>


<div class="level-map">

  <div class="level-step active" id="map1">
    1 • WORD HUNT
  </div>

  <div class="level-step" id="map2">
    2 • PUZZLE
  </div>

  <div class="level-step" id="map3">
    3 • COMPLETE
  </div>

  <div class="level-step" id="map4">
    4 • BUILD
  </div>

  <div class="level-step" id="map5">
    5 • MY SENTENCE
  </div>

</div>


<div class="status-box">

  <div class="status-row">

    <span id="statusLevel">
      Level 1 • Question 1/10
    </span>

    <span id="statusScore">
      ⭐ Points: 0/100
    </span>

  </div>

  <div class="progress">
    <div
      class="progress-bar"
      id="progressBar">
    </div>
  </div>

</div>


<div
  class="quiz-card"
  id="quizCard">

  <div
    class="level-label"
    id="levelLabel">
  </div>

  <h2
    class="question"
    id="question">
  </h2>


  <div class="picture-frame">

    <div
      class="picture"
      id="picture">
    </div>

    <div class="picture-label">
      👁️ LOOK CAREFULLY AT THE PICTURE
    </div>

  </div>


  <div
    class="answers"
    id="answers">
  </div>


  <div
    class="feedback"
    id="feedback">
  </div>


  <div
    class="hint"
    id="hint">
  </div>


  <div class="controls">

    <button
      class="hint-btn"
      id="hintBtn"
      onclick="showHint()">
      💡 HINT
    </button>

    <button
      class="next-btn"
      id="nextBtn"
      onclick="nextQuestion()">
      NEXT QUESTION →
    </button>

  </div>

</div>

</div>



<script>

/* =====================================
   STUDENT
===================================== */
const studentName =
localStorage.getItem("sentenceQuestStudentName")
|| "Student";

const studentClass =
localStorage.getItem("sentenceQuestStudentClass")
|| "-";

document.getElementById("displayName").innerText = studentName;
document.getElementById("displayClass").innerText = studentClass;


/* =====================================
   GOOGLE SHEETS DATABASE
===================================== */
const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycby84aD1yrCse0CKs78jKTG_bDAhA42TlsCjLJsRL3PkDEhXZadGcmu-moxorgP_IXN8/exec";

let resultAlreadySaved = false;


/* =====================================
   MISSION 2 DATA
   Get Smart Plus 3 • My Day
===================================== */

const routines = [
  "wake up","brush my teeth","take a shower","get dressed",
  "have breakfast","go to school","have lunch","do homework",
  "have dinner","go to bed","do exercise","ride a bike",
  "play football","watch TV"
];

const activityEmoji = {
  "wake up":"🛏️",
  "brush my teeth":"🪥",
  "take a shower":"🚿",
  "get dressed":"👕",
  "have breakfast":"🥣",
  "go to school":"🎒",
  "have lunch":"🍱",
  "do homework":"📚",
  "have dinner":"🍽️",
  "go to bed":"🌙",
  "do exercise":"🤸",
  "ride a bike":"🚲",
  "play football":"⚽",
  "watch TV":"📺"
};

const level1 = [
  {subject:"He", activity:"wake up", emoji:"🛏️", hint:"You do this when you stop sleeping in the morning."},
  {subject:"She", activity:"brush my teeth", emoji:"🪥", hint:"You use a toothbrush for this routine."},
  {subject:"Ali", activity:"take a shower", emoji:"🚿", hint:"You use water to wash your body."},
  {subject:"Siti", activity:"get dressed", emoji:"👕", hint:"You put on your clothes."},
  {subject:"He", activity:"have breakfast", emoji:"🥣", hint:"This is the first meal of the day."},
  {subject:"She", activity:"go to school", emoji:"🎒", hint:"You carry your school bag for this routine."},
  {subject:"Ali", activity:"have lunch", emoji:"🍱", hint:"This meal is usually eaten around midday."},
  {subject:"Siti", activity:"do homework", emoji:"📚", hint:"You complete school work at home."},
  {subject:"They", activity:"have dinner", emoji:"🍽️", hint:"This is the evening meal."},
  {subject:"We", activity:"go to bed", emoji:"🌙", hint:"You do this when it is time to sleep."}
];

const level2 = [
  {subject:"I", activity:"wake up", time:"seven o'clock", h:7,m:0},
  {subject:"She", activity:"brush her teeth", baseActivity:"brush my teeth", time:"quarter past seven", h:7,m:15},
  {subject:"Ali", activity:"has breakfast", baseActivity:"have breakfast", time:"half past seven", h:7,m:30},
  {subject:"You", activity:"go to school", time:"quarter to eight", h:7,m:45},
  {subject:"We", activity:"have lunch", time:"one o'clock", h:1,m:0},
  {subject:"Siti", activity:"does her homework", baseActivity:"do homework", time:"half past three", h:3,m:30},
  {subject:"They", activity:"ride a bike", time:"quarter past five", h:5,m:15},
  {subject:"He", activity:"plays football", baseActivity:"play football", time:"half past five", h:5,m:30},
  {subject:"Siti and Amin", activity:"watch TV", time:"eight o'clock", h:8,m:0},
  {subject:"She", activity:"goes to bed", baseActivity:"go to bed", time:"quarter to ten", h:9,m:45}
];

const level3 = [
  {subject:"He", activity:"wakes up", baseActivity:"wake up", time:"six o'clock", h:6,m:0},
  {subject:"Siti", activity:"brushes her teeth", baseActivity:"brush my teeth", time:"quarter past six", h:6,m:15},
  {subject:"I", activity:"take a shower", time:"half past six", h:6,m:30},
  {subject:"Ali", activity:"gets dressed", baseActivity:"get dressed", time:"quarter to seven", h:6,m:45},
  {subject:"We", activity:"have breakfast", time:"seven o'clock", h:7,m:0},
  {subject:"You", activity:"go to school", time:"half past seven", h:7,m:30},
  {subject:"They", activity:"have lunch", time:"one o'clock", h:1,m:0},
  {subject:"She", activity:"does exercise", baseActivity:"do exercise", time:"half past four", h:4,m:30},
  {subject:"Siti and Amin", activity:"have dinner", time:"quarter past seven", h:7,m:15},
  {subject:"He", activity:"goes to bed", baseActivity:"go to bed", time:"quarter to ten", h:9,m:45}
];

const level4 = [
  {subject:"He", activity:"wakes up", baseActivity:"wake up", time:"half past six", h:6,m:30},
  {subject:"She", activity:"brushes her teeth", baseActivity:"brush my teeth", time:"quarter to seven", h:6,m:45},
  {subject:"Ali", activity:"takes a shower", baseActivity:"take a shower", time:"seven o'clock", h:7,m:0},
  {subject:"Siti", activity:"gets dressed", baseActivity:"get dressed", time:"quarter past seven", h:7,m:15},
  {subject:"You", activity:"go to school", time:"quarter to eight", h:7,m:45},
  {subject:"We", activity:"have lunch", time:"one o'clock", h:1,m:0},
  {subject:"They", activity:"do exercise", time:"half past four", h:4,m:30},
  {subject:"Siti and Amin", activity:"ride a bike", time:"quarter past five", h:5,m:15},
  {subject:"He", activity:"watches TV", baseActivity:"watch TV", time:"half past eight", h:8,m:30},
  {subject:"She", activity:"goes to bed", baseActivity:"go to bed", time:"quarter to ten", h:9,m:45}
];

const level5 = [
  {subject:"I", activity:"wake up", time:"seven o'clock", h:7,m:0},
  {subject:"She", activity:"brushes her teeth", baseActivity:"brush my teeth", time:"quarter past seven", h:7,m:15},
  {subject:"Ali", activity:"has breakfast", baseActivity:"have breakfast", time:"half past seven", h:7,m:30},
  {subject:"You", activity:"go to school", time:"quarter to eight", h:7,m:45},
  {subject:"We", activity:"have lunch", time:"one o'clock", h:1,m:0},
  {subject:"Siti", activity:"does her homework", baseActivity:"do homework", time:"half past three", h:3,m:30},
  {subject:"They", activity:"play football", time:"quarter past five", h:5,m:15},
  {subject:"Siti and Amin", activity:"have dinner", time:"seven o'clock", h:7,m:0},
  {subject:"He", activity:"watches TV", baseActivity:"watch TV", time:"half past eight", h:8,m:30},
  {subject:"She", activity:"goes to bed", baseActivity:"go to bed", time:"quarter to ten", h:9,m:45}
];

const questionSets = [level1,level2,level3,level4,level5];


/* =====================================
   STATE
===================================== */
let level = 0;
let index = 0;
let score = 0;
let questionAttempts = 0;
let hints = 0;
let totalWrongAttempts = 0;

let levelScores = [0,0,0,0,0];
let levelHints = [0,0,0,0,0];
let levelSupport = [0,0,0,0,0];

const levelNames = [
  "WORD HUNT",
  "SENTENCE PUZZLE",
  "COMPLETE IT!",
  "PICTURE BUILDER",
  "MY SENTENCE"
];

loadQuestion();


/* =====================================
   HELPERS FOR LANGUAGE
===================================== */
function baseActivity(data){
  return data.baseActivity || data.activity;
}

function sentenceFor(data){
  return data.subject + " " + data.activity + " at " + data.time + ".";
}

function normalize(text){
  return String(text)
    .toLowerCase()
    .trim()
    .replace(/[.!?]/g,"")
    .replace(/\s+/g," ");
}


/* =====================================
   LOAD QUESTION
===================================== */
function loadQuestion(){
  questionAttempts = 0;
  resetUI();
  updateStatus();

  const data = questionSets[level][index];

  renderPicture(data);

  document.getElementById("levelLabel").innerText =
    "LEVEL " + (level + 1) + " • " + levelNames[level];

  if(level === 0) loadLevel1(data);
  else if(level === 1) loadLevel2(data);
  else if(level === 2) loadLevel3(data);
  else if(level === 3) loadLevel4(data);
  else loadLevel5(data);
}


/* =====================================
   VISUAL: DAILY ROUTINE + EXACT CLOCK
===================================== */
function renderPicture(data){
  const showClock = level >= 1;
  const emoji = data.emoji || activityEmoji[baseActivity(data)] || "⭐";

  document.getElementById("picture").innerHTML = `
    <div class="myday-scene">
      <div class="routine-visual">
        <div class="routine-emoji">${emoji}</div>
        <div class="subject-chip">${data.subject}</div>
      </div>
      ${showClock ? `<div class="clock-wrap">${clockSVG(data.h,data.m)}</div>` : ""}
    </div>
  `;
}

function clockSVG(hour, minute){
  const minuteAngle = minute * 6;
  const hourAngle = ((hour % 12) + minute / 60) * 30;

  let nums = "";
  for(let n=1;n<=12;n++){
    const a=(n*30-90)*Math.PI/180;
    const x=100+70*Math.cos(a);
    const y=100+70*Math.sin(a)+5;
    nums += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle"
      font-size="15" font-weight="900" fill="#17324d">${n}</text>`;
  }

  return `
  <svg viewBox="0 0 200 200" role="img" aria-label="Clock showing ${hour}:${String(minute).padStart(2,"0")}">
    <circle cx="100" cy="100" r="94" fill="white" stroke="#075985" stroke-width="7"/>
    ${nums}
    <line x1="100" y1="100" x2="100" y2="55"
      stroke="#17324d" stroke-width="8" stroke-linecap="round"
      transform="rotate(${hourAngle} 100 100)"/>
    <line x1="100" y1="100" x2="100" y2="32"
      stroke="#0284c7" stroke-width="5" stroke-linecap="round"
      transform="rotate(${minuteAngle} 100 100)"/>
    <circle cx="100" cy="100" r="7" fill="#f59e0b"/>
  </svg>`;
}


/* =====================================
   LEVEL 1 • WORD HUNT
===================================== */
function loadLevel1(data){
  document.getElementById("question").innerText =
    "Look at the picture. Which daily routine is it?";

  const wrong = routines
    .filter(x => x !== data.activity)
    .sort(() => Math.random() - .5)
    .slice(0,3);

  createOptions(shuffle([data.activity,...wrong]), data.activity);
}


/* =====================================
   LEVEL 2 • SENTENCE PUZZLE
===================================== */
function loadLevel2(data){
  document.getElementById("question").innerText =
    "Which sentence is in the correct order?";

  const correct = sentenceFor(data);
  const parts = [data.subject, data.activity, "at", data.time];

  const wrong1 = [data.time,"at",data.activity,data.subject].join(" ") + ".";
  const wrong2 = [data.subject,"at",data.time,data.activity].join(" ") + ".";
  const wrong3 = [data.activity,data.subject,"at",data.time].join(" ") + ".";

  createOptions(shuffle([correct,wrong1,wrong2,wrong3]), correct);
}


/* =====================================
   LEVEL 3 • COMPLETE IT
===================================== */
function loadLevel3(data){

  const wrong = timeChoices
    .filter(x => x !== data.time)

/* =====================================
   LEVEL 4 • PICTURE BUILDER
===================================== */
function loadLevel4(data){
  document.getElementById("question").innerText =
    "Choose the best sentence for the picture and clock.";

  const correct = sentenceFor(data);

  const wrongTime =
    data.time === "half past six" ? "six o'clock" :
    data.time === "quarter to seven" ? "quarter past seven" :
    data.time === "seven o'clock" ? "half past seven" :
    data.time === "quarter past seven" ? "quarter to seven" :
    data.time === "quarter to eight" ? "quarter past eight" :
    data.time === "one o'clock" ? "half past one" :
    data.time === "half past four" ? "four o'clock" :
    data.time === "quarter past five" ? "quarter to five" :
    data.time === "half past eight" ? "eight o'clock" :
    "half past nine";

  const wrong1 = data.subject + " " + data.activity + " at " + wrongTime + ".";

  const otherActivity =
    baseActivity(data) === "watch TV" ? "plays football" :
    baseActivity(data) === "go to bed" ? "watches TV" :
    baseActivity(data) === "ride a bike" ? "play football" :
    baseActivity(data) === "have lunch" ? "have breakfast" :
    "watches TV";

  const wrong2 = data.subject + " " + otherActivity + " at " + data.time + ".";
  const wrong3 = data.subject + " " + otherActivity + " at " + wrongTime + ".";

  createOptions(shuffle([correct,wrong1,wrong2,wrong3]), correct);
}

   LEVEL 5 • MY SENTENCE

/* =====================================
   OPTIONS
===================================== */
function createOptions(options, correct){
  const area = document.getElementById("answers");
  area.innerHTML = "";

  options.forEach(option => {
    const button = document.createElement("button");
    button.className = "answer";
    button.innerText = option;
    button.onclick = function(){
      checkOption(button, option, correct);
    };
    area.appendChild(button);
  });
}


/* =====================================
   CHECK MCQ
===================================== */
function checkOption(button, selected, correct){
  questionAttempts++;

  if(selected === correct){
    button.classList.add("correct");

    const points = questionAttempts === 1 ? 2 : 1;
    score += points;
    levelScores[level] += points;

    disableAnswers();

    const feedback = document.getElementById("feedback");
    feedback.className = "feedback good";
    feedback.innerHTML =
      points === 2
      ? "⭐ Excellent! Correct on your first try!"
      : "👍 Well done! You found the correct answer.";

    showNext();
    updateScore();
  }
  else{
    totalWrongAttempts++;
    button.classList.add("wrong");
    button.disabled = true;

    if(questionAttempts === 1){
      const feedback = document.getElementById("feedback");
      feedback.className = "feedback bad";
      feedback.innerHTML =
        "Good try! Look carefully at the routine and the clock, then try one more time.";
      showHint();
    }
    else{
      levelSupport[level]++;
      revealCorrectAnswer(correct);

      const feedback = document.getElementById("feedback");
      feedback.className = "feedback learn";
      feedback.innerHTML =
        "💡 <b>Let's learn!</b><br>The correct answer is:<br><br><b>" +
        correct +
        "</b><br><br>Read it carefully before you continue.";

      disableAnswers();
      showNext();
    }
  }
}


/* =====================================
   WRITING
===================================== */
function checkWriting(){
  const textarea = document.getElementById("studentSentence");
  const answer = normalize(textarea.value);

  if(answer === ""){
    const feedback = document.getElementById("feedback");
    feedback.className = "feedback bad";
    feedback.innerHTML = "Write a sentence first.";
    return;
  }

  questionAttempts++;

  const data = questionSets[level][index];
  const correct = normalize(sentenceFor(data));

  if(answer === correct){
    const points = questionAttempts === 1 ? 2 : 1;
    score += points;
    levelScores[level] += points;

    const feedback = document.getElementById("feedback");
    feedback.className = "feedback good";
    feedback.innerHTML =
      points === 2
      ? "🏆 Fantastic! You wrote the sentence independently!"
      : "👍 Great! Your sentence is correct.";

    document.getElementById("checkWritingBtn").disabled = true;
    textarea.disabled = true;

    showNext();
    updateScore();
  }
  else{
    totalWrongAttempts++;

    if(questionAttempts === 1){
      const feedback = document.getElementById("feedback");
      feedback.className = "feedback bad";
      feedback.innerHTML =
        "Good try! Check the subject, daily routine and time. Try one more time.";
      showHint();
    }
    else{
      levelSupport[level]++;

      const feedback = document.getElementById("feedback");
      feedback.className = "feedback learn";
      feedback.innerHTML =
        "💡 <b>Let's learn from an example.</b><br><br>" +
        "Suggested sentence:<br><br><b>" +
        sentenceFor(data) +
        "</b><br><br>Read the sentence before continuing.";

      document.getElementById("checkWritingBtn").disabled = true;
      textarea.disabled = true;
      showNext();
    }
  }
}


/* =====================================
   HINT
===================================== */
function showHint(){
  const hint = document.getElementById("hint");

  if(hint.style.display !== "block"){
    hints++;
    levelHints[level]++;
  }

  hint.style.display = "block";
  const data = questionSets[level][index];

  if(level === 0){
    hint.innerText = data.hint;
  }
  else if(level === 1){
    hint.innerText =
      "Sentence pattern: SUBJECT + DAILY ROUTINE + AT + TIME.";
  }
  else if(level === 2){
    hint.innerText =
      "Read the minute hand first: 12 = o'clock, 3 = quarter past, 6 = half past, 9 = quarter to.";
  }
  else if(level === 3){
    hint.innerText =
      "Check both clues: What is the person doing? What time does the clock show?";
  }
  else{
    hint.innerText =
      "Start with “" + data.subject + "” and use: daily routine + at + time.";
  }

  document.getElementById("hintBtn").style.display = "none";
}


/* =====================================
   NEXT
===================================== */
function nextQuestion(){
  if(index < 9){
    index++;
  }
  else{
    document.getElementById("map" + (level + 1)).classList.remove("active");
    document.getElementById("map" + (level + 1)).classList.add("done");

    if(level < 4){
      level++;
      index = 0;
      document.getElementById("map" + (level + 1)).classList.add("active");
    }
    else{
      showResult();
      return;
    }
  }

  loadQuestion();
  window.scrollTo({top:0,behavior:"smooth"});
}


/* =====================================
   STATUS / UI
===================================== */
function updateStatus(){
  document.getElementById("statusLevel").innerText =
    "Level " + (level + 1) + " • Question " + (index + 1) + "/10";

  const completed = (level * 10) + index;
  document.getElementById("progressBar").style.width =
    Math.max(2,(completed / 50) * 100) + "%";
}

function updateScore(){
  document.getElementById("statusScore").innerText =
    "⭐ Points: " + score + "/100";
}

function resetUI(){
  const feedback = document.getElementById("feedback");
  feedback.className = "feedback";
  feedback.innerHTML = "";

  document.getElementById("hint").style.display = "none";
  document.getElementById("hintBtn").style.display = "block";
  document.getElementById("nextBtn").style.display = "none";
}

function disableAnswers(){
  document.querySelectorAll(".answer").forEach(button => {
    button.disabled = true;
  });
}

function revealCorrectAnswer(correct){
  document.querySelectorAll(".answer").forEach(button => {
    if(button.innerText.trim() === correct.trim()){
      button.classList.add("correct");
    }
  });
}

function showNext(){
  document.getElementById("nextBtn").style.display = "block";
}

function shuffle(array){
  return [...array].sort(() => Math.random() - .5);
}

===================================== */

      <tr><td>Sentence Puzzle</td><td>${levelScores[1]}/20</td><td>${levelHints[1]}</td><td>${levelSupport[1]}</td></tr>

      <tr><td>Picture Builder</td><td>${levelScores[3]}/20</td><td>${levelHints[3]}</td><td>${levelSupport[3]}</td></tr>
      <tr><td>My Sentence</td><td>${levelScores[4]}/20</td><td>${levelHints[4]}</td><td>${levelSupport[4]}</td></tr>

/* =====================================
   SAVE TO GOOGLE SHEETS
===================================== */
function saveResult(masteryText){
  if(resultAlreadySaved) return;
  resultAlreadySaved = true;

  const resultData = {
    studentName: studentName,
    studentClass: studentClass,
    year: "Year 3",
    topic: "My Day",
    totalScore: score,
    percentage: Math.round(score),
    masteryLevel: masteryText,
    hintsUsed: hints,
    wrongAttempts: totalWrongAttempts,
    wordHunt: levelScores[0],
    sentencePuzzle: levelScores[1],
    completeIt: levelScores[2],
    pictureBuilder: levelScores[3],
    mySentence: levelScores[4]
  };

  fetch(GOOGLE_SCRIPT_URL,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(resultData)
  })
  .then(response => response.json())
  .then(data => {
    const saveStatus = document.getElementById("saveStatus");
    if(!saveStatus) return;

    if(data.status === "success"){
      saveStatus.innerHTML = "✅ Your result has been saved successfully.";
      saveStatus.style.background = "#dcfce7";
      saveStatus.style.color = "#166534";
    }
    else{
      resultAlreadySaved = false;
      saveStatus.innerHTML = "⚠️ Your result could not be saved.";
      saveStatus.style.background = "#fee2e2";
      saveStatus.style.color = "#991b1b";
    }
  })
  .catch(error => {
    console.error("Sentence Quest save error:",error);
    resultAlreadySaved = false;
    const saveStatus = document.getElementById("saveStatus");
    if(saveStatus){
      saveStatus.innerHTML = "⚠️ Your result could not be saved.";
      saveStatus.style.background = "#fee2e2";
      saveStatus.style.color = "#991b1b";
    }
  });
}
